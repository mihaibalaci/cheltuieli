# Nginx reverse proxy for Cheltuieli
# Place in: /etc/nginx/sites-available/cheltuieli
# Enable: ln -s /etc/nginx/sites-available/cheltuieli /etc/nginx/sites-enabled/
# Then:   certbot --nginx -d your.domain.com

server {
    listen 80;
    server_name cheltuieli.local;   # change to your domain or LAN hostname

    # Increase upload limit for bank statement files
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

